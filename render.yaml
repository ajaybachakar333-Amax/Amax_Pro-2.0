
services:
  - type: web
    name: amax-pro
    runtime: docker
    healthCheckPath: /
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: UPI_ID
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"