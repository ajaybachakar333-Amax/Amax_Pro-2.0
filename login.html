<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAX - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card glow-card reveal">
            <div class="brand-block">
                <div class="brand-mark"><img src="{{ url_for('static', filename='uploads/amax-logo.jpeg') }}" alt="AMAX logo"></div>
                <h1>AMAX</h1>
                <p>Intelligent AI Assistant</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message flash-{{ category }}">
                            <i class="fas fa-{% if category == 'success' %}check-circle{% elif category == 'error' %}exclamation-circle{% else %}info-circle{% endif %}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="auth-form-wrap">
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in with your username or Gmail ID</p>

                <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                    <div class="form-group">
                        <label for="login_id">
                            <i class="fas fa-user"></i> Username or Gmail ID
                        </label>
                        <input
                            type="text"
                            id="login_id"
                            name="login_id"
                            placeholder="Enter username or Gmail ID"
                            autocomplete="username"
                            required
                            autofocus
                            value="{{ request.form.get('login_id', request.form.get('email', '')) }}"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye" id="toggle-icon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <p class="auth-footer">
                    New to AMAX?
                    <a href="{{ url_for('signup') }}">Sign Up</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const flashMessages = document.querySelectorAll('.flash-message');
            flashMessages.forEach(function(msg) {
                setTimeout(function() {
                    msg.style.opacity = '0';
                    msg.style.transform = 'translateY(-10px)';
                    setTimeout(function() {
                        msg.style.display = 'none';
                    }, 300);
                }, 5000);
            });
        });
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
